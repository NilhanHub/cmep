name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./prisma/portfolio-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22.15.0"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:setup
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
