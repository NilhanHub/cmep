objective: Determine whether CMEP v1 is genuinely working end-to-end locally on this machine as an offering-first CME platform, with first-class offerings, variants, prices, catalogs, catalog assignments, and customer-offering links driving the seven core surfaces while tenant isolation and portal scoping remain intact.
current_failure_or_uncertainty:
  - Prior accountable runs proved a workflow-centric local app, not the intended offering-first concept.
  - The repo has now been retrofitted and rerun, but Oracle must independently confirm the new claim from emitted evidence.
  - Oracle should still check for aggregate-only fallback paths, silent off-catalog defaults, cross-tenant catalog leakage, cross-client portal leakage, and runtime or hydration defects that only show up under accountable reruns.
canonical_claim_under_test:
  id: claim.offeringSpine
  claim: CMEP has a first-class offering/catalog spine and the core business flows route through it end-to-end.
exact_reproduction:
  - npm install
  - copy .env.example .env
  - npm run db:setup
  - npm run evidence:catalog
  - npm run verify:accountable
  - inspect artifacts/runs/20260413-154218Z-catalog-catalog-a39b4696
  - inspect artifacts/runs/20260413-154338Z-full-full-80b1451c
  - inspect artifacts/runs/20260413-153948Z-verify-verify-a066a5be
  - inspect san/state/proof-matrix.md
  - inspect san/verification/latest.md
  - npm run oracle:bundle
expected_behavior:
  - app boots locally from documented commands
  - first-class offering, variant, price, catalog, route-binding, and customer-offering entities exist
  - seven surfaces complete their accountable flow through the offering/catalog spine where appropriate
  - customer detail explicitly shows offering relationship states
  - quotes and invoices derive line items from offering prices by default
  - service bookings originate from service offerings or service variants
  - portal catalog visibility and requestability are constrained by catalog assignment
  - automation and search can target offering semantics
  - tenant isolation and portal scoping probes are denied
  - DB reset remains structurally deterministic on repeat reset
  - no unexpected runtime blockers or hidden hydration defects occur in the accountable run
actual_behavior_sources:
  proof_matrix: san/state/proof-matrix.json
  verification_summary: san/verification/latest.md
  latest_run_pointer: artifacts/runs/latest.json
  latest_catalog_run: artifacts/runs/20260413-154218Z-catalog-catalog-a39b4696
  latest_full_run: artifacts/runs/20260413-154338Z-full-full-80b1451c
  latest_verify_run: artifacts/runs/20260413-153948Z-verify-verify-a066a5be
