oracle_bundle_recipe:
  bundle_root_pointer: artifacts/oracle/latest.json
  must_verify:
    - first-class offering/service/catalog entities exist
    - customer-to-offering mapping is real
    - quotes, invoices, bookings, lifecycle, portal, automation, and search route through offering semantics
    - manual off-catalog exceptions are explicit and auditable
    - tenant isolation holds for catalog-linked flows
    - portal catalog restriction holds for client users
sanitization_rules:
  - never include raw env files
  - never include raw cookies or unsanitized portal keys
  - prefer pseudonymous identifiers in exported state
  - do not include raw sqlite files unless explicitly justified
acceptance_evidence_required:
  - claim-by-claim verdicts
  - exact evidence files used
  - exact root causes if any
  - minimum patch plan
  - explicit blind spots caused by missing evidence only
  - explicit verdict on whether CMEP is now offering-first
known_suspects:
  - revenue line-item derivation may still hide aggregate/manual defaults outside the accountable path
  - booking source truth may still regress if route bindings drift from booking types
  - lifecycle items may still fall back to generic work if future changes bypass offering linkage
  - portal visibility may still need close inspection around catalog assignment edges
recent_instrumentation_changes:
  - dedicated evidence:catalog run support
  - expanded state snapshots for catalog and customer-offering counts
  - accountable Playwright flow extended to prove offering creation, pricing, assignment, lifecycle, revenue, and portal restriction
